# Local development: Redis and both lanes of this image. The digitalizer's orchestrator runs from its own repo and
# points at this Redis (db 8); STORAGE_PATH must be the directory it reads and writes (./data here).
#
#   docker compose up --build

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  scan:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/8
      STORAGE_PATH: /mnt/data
      LOG_FORMAT: text
    volumes:
      - ./data:/mnt/data
    depends_on:
      - redis

  scan-interactive:
    build: .
    command: ["celery", "-A", "evilflowers_scan.worker", "worker", "--loglevel=INFO", "-E", "--concurrency=1",
              "--queues=evilflowers_scan.standalone.interactive"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/8
      STORAGE_PATH: /mnt/data
      LOG_FORMAT: text
    volumes:
      - ./data:/mnt/data
    depends_on:
      - redis
